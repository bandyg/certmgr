server:
  host: "0.0.0.0"
  port: 3111
  apiKey: "change-me-in-production"

caServer:
  url: "https://ca-server.example.com"
  authType: "api-key"
  apiKey: "ca-server-api-key"
  timeout: 30000
  password: "change-me"

scheduler:
  dailyCheckTime: "09:00"
  enabled: true

storage:
  basePath: "./data"
  certsDir: "certs"
  metadataDir: "metadata"

logging:
  level: "info"
  pattern: "%d{yyyy-MM-dd hh:mm:ss.SSS} [%p] %c - %m"
  fileName: "cert-manager.log"
